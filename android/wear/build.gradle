apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseKeystoreFile = keystoreProperties['storeFile'] ? rootProject.file("app/${keystoreProperties['storeFile']}") : null
def hasReleaseSigning = keystorePropertiesFile.exists() &&
        releaseKeystoreFile != null &&
        releaseKeystoreFile.exists() &&
        keystoreProperties['keyAlias'] &&
        keystoreProperties['keyPassword'] &&
        keystoreProperties['storePassword']

android {
    namespace "com.lnlenost.registroelettronico.wear"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.lnlenost.registroelettronico"
        minSdkVersion 30
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? rootProject.file("app/${keystoreProperties['storeFile']}") : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            // Fall back to the debug key when no release keystore is configured,
            // so CI can still produce installable release artifacts.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
}
