name: iOS build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    # macos-14 was retired on 2026-11-02. The workflow pins Flutter 2.5.3
    # with `architecture: x64`, so keep a native Intel runner.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "2.5.3"
          architecture: x64
          channel: stable
      - name: Support Ruby 3.3 in Flutter podhelper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["FLUTTER_ROOT"]) / "packages/flutter_tools/bin/podhelper.rb"
          source = path.read_text()
          assert "File.exists?" in source
          path.write_text(source.replace("File.exists?", "File.exist?"))
          PY
      - run: flutter pub get
      - name: Refresh stale Firebase pod lock
        run: cd ios && pod update Firebase/CoreOnly
      - run: flutter test test/noticeboard_filter_test.dart
      - run: flutter test test/absences_filter_test.dart
      - run: flutter test test/navigation_config_test.dart
      - run: flutter test test/home_config_test.dart
      - run: flutter test test/notification_diff_test.dart
      - run: flutter test test/notification_preferences_test.dart
      - run: flutter test test/theme_event_test.dart
      - run: flutter test test/myprof_api_test.dart
      - run: flutter test test/background_sync_test.dart
      - run: flutter test test/notice_read_status_test.dart
      - run: flutter test test/sostituzioni_docenti_api_test.dart
      - run: flutter build ios --release --no-codesign
      - run: |
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r app.ipa Payload
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: registro-elettronico-ios-unsigned
          path: build/ios/iphoneos/app.ipa
